name: Build Blender APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Résumé des erreurs
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -9 | sed 's/^/::error::/' | tr -d '\r' | head -10 || true
      - uses: actions/upload-artifact@v4
        with:
          name: Blender-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publier l'APK (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Blender.apk
          gh release create "v1.0.${{ github.run_number }}" Blender.apk --title "Blender v1.0.${{ github.run_number }}" --notes "APK installable de Blender"
